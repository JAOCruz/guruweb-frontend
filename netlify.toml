[build]
  command = "npm install && npm run netlify-build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.11.1"
  SKIP_TYPESCRIPT = "true"
  NPM_FLAGS = "--no-package-lock"
  CI = "false"

# SPA redirect: let React Router handle all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
